[package]
name = "moka-canvas"
version = "0.1.0"
default-run = "moka-canvas"
description = "LeaferJS browser and Tauri compatibility showcase"
authors = ["Moka Canvas"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "moka_canvas"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
